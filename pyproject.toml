[build-system]
requires = ["scikit-build-core[pyproject]", "cython", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "pyfade"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.scikit-build]
build-dir = "build"
wheel.packages = ["pyfade"]
cmake.verbose = true

[tool.scikit-build.module.pyfade]
sources = [
  "pyfade/mycython_module.pyx",
  "pyfade/mylib.cpp",
  "pyfade/mykernel.cu"
]

[tool.scikit-build.cmake]
minimum-version = "3.18"
